[package]
name = "patamaps-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic correspondence checking and admission for Patamaps"

[features]
default = ["legacy-compat"]
legacy-compat = ["dep:jsonschema", "dep:icu_collator", "patamaps-contracts/legacy-compat"]

[dependencies]
patamaps-contracts = { path = "../patamaps-contracts", version = "0.1.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
thiserror.workspace = true
jsonschema = { workspace = true, optional = true }
icu_collator = { workspace = true, optional = true }

[lints]
workspace = true
