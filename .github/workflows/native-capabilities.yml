name: Native capability acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Run native Linux acceptance as root
        shell: bash
        run: |
          sudo env CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" PATH="$PATH" \
            CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 \
            python3 -B scripts/capabilities/linux.py \
              --cargo "$HOME/.cargo/bin/cargo" \
              --output "$GITHUB_WORKSPACE/ci-evidence" \
              --architecture "${{ matrix.architecture }}" \
              --fixtures "/tmp/patamaps-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Retain Linux fixture material
        if: always()
        shell: bash
        run: |
          mkdir -p ci-evidence
          fixture_path="/tmp/patamaps-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if sudo test -d "$fixture_path"; then
            sudo tar -czf "$GITHUB_WORKSPACE/ci-evidence/fixtures.tar.gz" -C /tmp "$(basename "$fixture_path")"
            sudo chmod 0644 "$GITHUB_WORKSPACE/ci-evidence/fixtures.tar.gz"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-linux-${{ matrix.architecture }}-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: error

  cross-stack-source:
    name: Cross-stack source bindings (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PATAMAPS_CROSS_STACK_COMPILER_PROFILE: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Prepare exact public fixture dependencies
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          cargo fetch --manifest-path examples/cross-stack/service/Cargo.toml --locked
          npm ci --prefix examples/cross-stack/web --ignore-scripts --no-audit --no-fund
      - name: Check actual source providers, admission and offline replay
        run: python3 -B scripts/ci_cross_stack.py
      - name: Verify coherent development selection and foreground watch
        run: python3 -B scripts/ci_cross_stack.py --phase development
      - name: Verify explicit MetaMap conversion and paired source decisions
        run: python3 -B scripts/ci_cross_stack.py --phase compatibility
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cross-stack-diagnostics-source-${{ github.sha }}
          path: |
            ci-evidence/cross-stack-*/receipt.json
            ci-evidence/cross-stack-image/image-controls.json
            ci-evidence/cross-stack-image/browser/
            ci-evidence/cross-stack-compatibility/metamap-comparison/receipt.json
            ci-evidence/cross-stack-installed/installed-workflow/receipt.json
            ci-evidence/cross-stack-image/m6-runtime-*.log
            ci-evidence/cross-stack-compatibility/m7-actual-metamap-compiler.stderr.log
            ci-evidence/cross-stack-installed/installed-workflow/*.stderr.log
            ci-evidence/cross-stack-installed/installed-workflow/m6-runtime-*.log
          if-no-files-found: warn
      - name: Retain source fixtures and tool symlink metadata
        if: always()
        shell: bash
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import tarfile, json
          evidence = Path("ci-evidence")
          evidence.mkdir(exist_ok=True)
          work = evidence / "cross-stack-source"
          if not work.exists():
              work.mkdir()
              (work / "not-run.json").write_text(json.dumps({"status": "source job did not reach its entry point"}) + "\n")
          workspaces = sorted(p for p in evidence.glob("cross-stack-*") if p.is_dir())
          with tarfile.open(evidence / "cross-stack-source.tar.gz", "x:gz", dereference=False, compresslevel=2) as archive:
              for workspace in workspaces:
                  receipt = workspace / "receipt.json"
                  if receipt.exists():
                      archive.add(receipt, arcname=workspace.name + "/receipt.json")
              for workspace in workspaces:
                  for child in sorted(workspace.iterdir()):
                      if child.name != "receipt.json":
                          archive.add(child, arcname=workspace.name + "/" + child.name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cross-stack-source-linux-x86_64-${{ github.sha }}
          path: ci-evidence/cross-stack-source.tar.gz
          if-no-files-found: error
  cross-stack-image:
    name: Cross-stack Linux image and browser (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=2048
      BUILDX_METADATA_PROVENANCE: max
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/ci-browser-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Prepare pinned application and browser dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lld
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          cargo fetch --manifest-path examples/cross-stack/service/Cargo.toml --locked
          npm ci --prefix examples/cross-stack/web --ignore-scripts --no-audit --no-fund
          npm ci --prefix examples/cross-stack/acceptance/browser --ignore-scripts --no-audit --no-fund
          node examples/cross-stack/acceptance/browser/node_modules/playwright/cli.js install chromium --only-shell
      - name: Build and inspect Linux images; exercise real HTTP and browser
        run: python3 -B scripts/ci_cross_stack.py --phase image
      - name: Verify MetaMap decisions with actual Linux release observations
        run: python3 -B scripts/ci_cross_stack.py --phase compatibility
      - name: Install an exact package and rerun the mixed workflow
        run: python3 -B scripts/ci_cross_stack.py --phase installed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cross-stack-diagnostics-image-${{ github.sha }}
          path: |
            ci-evidence/cross-stack-*/receipt.json
            ci-evidence/cross-stack-image/image-controls.json
            ci-evidence/cross-stack-image/browser/
            ci-evidence/cross-stack-compatibility/metamap-comparison/receipt.json
            ci-evidence/cross-stack-installed/installed-workflow/receipt.json
            ci-evidence/cross-stack-image/m6-runtime-*.log
            ci-evidence/cross-stack-compatibility/m7-actual-metamap-compiler.stderr.log
            ci-evidence/cross-stack-installed/installed-workflow/*.stderr.log
            ci-evidence/cross-stack-installed/installed-workflow/m6-runtime-*.log
          if-no-files-found: warn
      - name: Retain owned images, candidates, traces and logs
        if: always()
        run: python3 -B scripts/archive_cross_stack_ci.py --phase image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cross-stack-linux-image-browser-${{ github.sha }}
          path: |
            ci-evidence/cross-stack-image-evidence.tar.gz
            ci-evidence/cross-stack-owned-images.tar.gz
            ci-evidence/cross-stack-image-archive-receipt.json
          if-no-files-found: error
