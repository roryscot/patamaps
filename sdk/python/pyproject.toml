name = "patamaps-native-sdk-draft"
version = "0.1.0"
description = "Thin transport to an explicitly installed Patamaps native CLI"
requires-python = ">=3.9"
license = "Apache-2.0"

[tool.setuptools]
packages = ["patamaps"]
