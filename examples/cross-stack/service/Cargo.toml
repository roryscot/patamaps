[package]
name = "catalog-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tiny_http = "=0.12.0"
toml_edit = { version = "=0.23.7", default-features = false, features = ["parse"] }
